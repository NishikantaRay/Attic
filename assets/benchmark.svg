<svg xmlns="http://www.w3.org/2000/svg" width="880" height="268" viewBox="0 0 880 268" role="img">
<rect width="880" height="268" rx="10" fill="#0d1117"/>

<text x="24" y="34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Input tokens to answer one question about known code</text>
<text x="24" y="56" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">26-file fixture, median of 3 runs, both arms answered correctly 3/3</text>

  <text x="24" y="106" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e6edf3">without attic</text>
  <rect x="150" y="88" width="380" height="26" rx="4" fill="#f85149"/>
  <text x="542" y="106" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#e6edf3">90,272</text>
  <text x="620" y="106" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">reads the repo</text>

  <text x="24" y="152" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e6edf3">with attic</text>
  <rect x="150" y="134" width="255" height="26" rx="4" fill="#3fb950"/>
  <text x="417" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#e6edf3">60,687</text>
  <text x="495" y="152" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b949e">answer already stashed</text>
<line x1="24" y1="188" x2="856" y2="188" stroke="#30363d"/>
<text x="24" y="212" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">A second run of the same benchmark measured -66.6%. The spread is real:</text>
<text x="24" y="232" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#8b949e">the direction is the finding, not the exact percentage. When nothing relevant is</text>
<text x="24" y="252" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#d29922">stashed, Attic costs more than it returns — measured at +4.7%.</text>
</svg>