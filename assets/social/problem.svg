<text x="122" y="80" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="26" font-weight="700" fill="#1A1815">Attic</text>
<text x="1128" y="80" text-anchor="end" font-family="Futura, 'Avenir Next', Avenir, sans-serif" font-size="15" letter-spacing="1.4" fill="#6B6459">CLAUDE CODE · CODEX CLI</text>
<text x="72" y="182" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="46" font-weight="700" fill="#1A1815">Your agent figured it out once.</text>
<text x="72" y="234" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="46" font-weight="700" fill="#0B5D3B">Now it remembers.</text>
<text x="72" y="300" font-family="Futura, 'Avenir Next', Avenir, sans-serif" font-size="15" letter-spacing="1.6" fill="#6B6459">WITHOUT ATTIC</text>
<text x="72" y="344" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="20" fill="#1A1815" opacity="0.8">maxmemory-policy is allkeys-lru,</text>
<text x="72" y="378" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="20" fill="#1A1815" opacity="0.45">so session keys get evicted…</text>
<text x="72" y="412" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="20" fill="#1A1815" opacity="0.22">…something about volatile-</text>
<text x="72" y="446" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="20" fill="#1A1815" opacity="0.1">…lru?</text>
<text x="72" y="500" font-family="Menlo, 'SF Mono', monospace" font-size="16" fill="#6B6459">reads the same files again</text>
<path d="M 612 292 L 612 508" stroke="#E2DCD0" stroke-width="1.5" stroke-dasharray="3 7"/>
<text x="660" y="300" font-family="Futura, 'Avenir Next', Avenir, sans-serif" font-size="15" letter-spacing="1.6" fill="#0B5D3B">WITH ATTIC</text>
<rect x="660" y="318" width="468" height="152" rx="4" fill="#FFFFFF" stroke="#E2DCD0"/>
<rect x="660" y="318" width="7" height="152" rx="3" fill="#0B5D3B"/>
<text x="688" y="352" font-family="Menlo, 'SF Mono', monospace" font-size="17" fill="#0B5D3B">attic:redis-eviction</text>
<text x="688" y="386" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="20" fill="#1A1815">maxmemory-policy is allkeys-lru,</text>
<text x="688" y="412" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="20" fill="#1A1815">so session keys get evicted.</text>
<text x="688" y="446" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="20" fill="#6B6459">Fix: volatile-lru.</text>
<text x="660" y="500" font-family="Menlo, 'SF Mono', monospace" font-size="16" fill="#0B5D3B">still there tomorrow</text>

