<text x="152" y="112" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="34" font-weight="700" fill="#1A1815">Attic</text>
<text x="80" y="270" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="52" font-weight="700" fill="#1A1815">Your agent forgets</text>
<text x="80" y="330" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="52" font-weight="700" fill="#1A1815">what it figured out.</text>
<text x="80" y="400" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="26" fill="#6B6459">Attic writes it down, so tomorrow</text>
<text x="80" y="436" font-family="Charter, 'Iowan Old Style', Georgia, serif" font-size="26" fill="#6B6459">it already knows.</text>
<text x="80" y="512" font-family="Futura, 'Avenir Next', Avenir, sans-serif" font-size="17" letter-spacing="0.8" fill="#6B6459">INPUT TOKENS SAVED, PER SESSION</text>

