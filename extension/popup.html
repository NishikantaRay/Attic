<meta charset="utf-8">
<title>Attic</title>
<link rel="stylesheet" href="popup.css">
<div class="wrap">
  <header>
    <span class="brand">attic</span>
    <span id="status" class="status" title="companion status">checking…</span>
  </header>

  <nav class="tabs">
    <button class="tab is-on" data-tab="clip">Clip</button>
    <button class="tab" data-tab="browse">Browse</button>
  </nav>

  <section id="panel-clip" class="panel">
    <label>Title<input id="f-title" type="text" autocomplete="off"></label>
    <div class="handle">→ <code id="f-handle">attic:…</code></div>
    <div class="row">
      <label class="grow">Kind
        <select id="f-kind">
          <option value="note" selected>note</option>
          <option value="finding">finding</option>
          <option value="decision">decision</option>
          <option value="plan">plan</option>
          <option value="output">output</option>
        </select>
      </label>
      <label class="grow">Tags<input id="f-tags" type="text" placeholder="a, b" autocomplete="off"></label>
    </div>
    <label>Hook <span class="hint">one line, shown in the index</span>
      <input id="f-hook" type="text" maxlength="100" autocomplete="off">
    </label>
    <label>Body<textarea id="f-body" rows="7"></textarea></label>
    <button id="do-stash" class="primary">Stash to attic</button>
    <p id="clip-msg" class="msg" hidden></p>
  </section>

  <section id="panel-browse" class="panel" hidden>
    <input id="q" type="search" placeholder="search the attic…" autocomplete="off">
    <div id="results" class="results"></div>
  </section>
</div>
<script type="module" src="popup.js"></script>
