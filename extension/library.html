<meta charset="utf-8">
<title>Attic</title>
<link rel="stylesheet" href="library.css">

<div id="setup" class="setup" hidden>
  <div class="setup-card">
    <div class="brand-lg">attic</div>
    <p id="setup-msg" class="setup-msg">Looking for a companion…</p>
    <div id="setup-detail" class="setup-detail" hidden></div>
    <button id="setup-btn" class="primary" hidden>Connect</button>
    <details class="adv">
      <summary>Advanced</summary>
      <label>Port<input id="s-port" type="number" value="8787"></label>
      <label>Token<input id="s-token" type="password" autocomplete="off"></label>
      <label>Project root<input id="s-root" type="text" autocomplete="off"></label>
      <button id="s-save" class="ghost">Save manually</button>
    </details>
  </div>
</div>

<div id="app" class="app" hidden>
  <header class="top">
    <span class="brand">attic</span>
    <select id="root-picker" class="root-picker" title="project"></select>
    <input id="q" type="search" placeholder="Search titles, hooks, bodies…" autocomplete="off">
    <span id="count" class="count"></span>
    <button id="clip" class="clip-btn" title="Clip the current tab">+ Clip tab</button>
    <button id="refresh" class="icon-btn" title="Refresh">⟳</button>
    <button id="settings" class="icon-btn" title="Connection">⚙</button>
  </header>

  <nav class="filters" id="filters"></nav>

  <main class="cols">
    <aside class="list" id="list"></aside>
    <section class="reader" id="reader">
      <div class="reader-empty">Select an item to read it.</div>
    </section>

    <form class="clip-form" id="clip-form" hidden>
      <h2>Clip a page</h2>
      <label>Title<input id="f-title" type="text" autocomplete="off"></label>
      <div class="handle">→ <code id="f-handle">attic:…</code></div>
      <div class="row">
        <label class="grow">Kind
          <select id="f-kind">
            <option value="note" selected>note</option>
            <option value="finding">finding</option>
            <option value="decision">decision</option>
            <option value="plan">plan</option>
            <option value="output">output</option>
          </select>
        </label>
        <label class="grow">Tags<input id="f-tags" type="text" placeholder="a, b" autocomplete="off"></label>
      </div>
      <label>Hook <span class="hint">one line, shown in the index</span>
        <input id="f-hook" type="text" maxlength="100" autocomplete="off"></label>
      <label>Body<textarea id="f-body" rows="12"></textarea></label>
      <div class="row">
        <button type="button" id="do-stash" class="primary">Stash to attic</button>
        <button type="button" id="cancel-clip" class="ghost">Cancel</button>
      </div>
      <p id="clip-msg" class="msg" hidden></p>
    </form>
  </main>
</div>

<script type="module" src="library.js"></script>
