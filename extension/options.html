<meta charset="utf-8">
<title>Attic — options</title>
<link rel="stylesheet" href="popup.css">
<div class="wrap" style="width:420px">
  <header><span class="brand">attic</span></header>
  <p class="hint" style="margin:0 0 12px">
    Start the companion in your project, then paste its token here.<br>
    <code>npm run attic:serve -- --root /path/to/project</code>
  </p>
  <label>Port<input id="o-port" type="number" value="8787"></label>
  <label>Token<input id="o-token" type="password" autocomplete="off"></label>
  <label>Project root <span class="hint">must match a --root the companion was started with</span>
    <input id="o-root" type="text" placeholder="/Users/you/code/project" autocomplete="off">
  </label>
  <button id="save" class="primary">Save &amp; test</button>
  <p id="msg" class="msg" hidden></p>
</div>
<script type="module" src="options.js"></script>
